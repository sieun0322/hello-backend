name: box-packer CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'box-packer/**'
  pull_request:
    branches: [main]
    paths:
      - 'box-packer/**'

defaults:
  run:
    working-directory: box-packer

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: box-packer/package-lock.json

      - name: 의존성 설치
        run: npm ci

      - name: 테스트
        run: npm test

      - name: 빌드
        run: npm run build

      - name: Vercel 배포
        if: github.ref == 'refs/heads/main'
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: box-packer
          vercel-args: '--prod'
